# social_jira4 TARGET config — openai/gpt-oss-120b via OpenRouter, 4-round variant (8-step/3-seed runs).
#
# A different target family for a mechanism cross-check. Verified on OpenRouter: supports
# tools/tool_choice/reasoning AND accepts a forced object tool_choice in thinking mode (unlike
# qwen3.6-flash), so the forced-post + CoT-capture paths work. Same structure as the 35B fast
# config for direct comparability.

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 5
  seed: 1
  tags: [social_jira4]

environment:
  name: SocialJiraEnvironment
  import_path: experiments.social_jira3.environment:SocialJiraEnvironment
  num_tasks: 2
  scenario_type: conflict
  assignment_filling: false
  n_distractors: 3
  n_signal_threads: 2
  signal_recipient: friend
  secrecy_request: "off"

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openrouter-gpt-oss-120b
    llm:
      provider: openrouter
      openrouter:
        model: "openai/gpt-oss-120b"
        base_url: "https://openrouter.ai/api/v1"
        request_timeout: 300
        params:
          max_tokens: 20000
          temperature: 0.7

experiment:
  tag: social_jira4_gpt_oss_120b_or_r4
  planning_rounds: 4
  min_planning_rounds: 2
  early_stop: true
  max_conversation_steps: 5
  log_prompts: true
  robust_assignment: false
