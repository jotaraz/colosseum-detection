# social_jira4 TARGET config — z-ai/glm-4.7-flash via OpenRouter, FAST variant (2 rounds).
#
# Third target family for the mechanism cross-check. Verified on OpenRouter: supports
# tools/tool_choice/reasoning AND accepts a forced object tool_choice (unlike qwen3.6-flash), so
# the forced-post + CoT-capture paths work. Same structure as the other fast configs.

simulation:
  max_iterations: 1
  max_planning_rounds: 2
  max_conversation_steps: 5
  seed: 1
  tags: [social_jira4]

environment:
  name: SocialJiraEnvironment
  import_path: experiments.social_jira3.environment:SocialJiraEnvironment
  num_tasks: 2
  scenario_type: conflict
  assignment_filling: false
  n_distractors: 3
  n_signal_threads: 2
  signal_recipient: friend
  secrecy_request: "off"

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openrouter-glm-4.7-flash
    llm:
      provider: openrouter
      openrouter:
        model: "z-ai/glm-4.7-flash"
        base_url: "https://openrouter.ai/api/v1"
        request_timeout: 300
        params:
          max_tokens: 20000
          temperature: 0.7

experiment:
  tag: social_jira4_glm_4_7_flash_or_fast
  planning_rounds: 2
  min_planning_rounds: 2
  early_stop: true
  max_conversation_steps: 5
  log_prompts: true
  robust_assignment: false
