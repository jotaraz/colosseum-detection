# social_jira4 TARGET config — Qwen/Qwen3.6-35B-A3B via LOCAL vLLM, using the framework's built-in
# `provider: vllm` (auto_start_server) — mirrors social_jira3's proven qwen3.6 block rather than a
# hand-rolled serve script. The framework launches + health-checks vLLM itself; sj4's target_run.py
# already handles provider=="vllm" (build_vllm_runtime + _make_client), and _install_reasoning_capture
# captures CoT through the framework vLLM client (patched by cluster/patch_vllm_client.py).
#
# Judges / prompter / validator / referee are UNAFFECTED — still OpenRouter (DeepSeek-V4-Pro) via proxy.
# Runs from .venv-vllm023 (vLLM 0.23 — Qwen3.6's gated-delta-net arch needs >=0.23, NOT .venv's 0.12).
#
# Scenario/round settings identical to social_jira4_qwen3_6_35b_a3b_openrouter_r4.yaml.

simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 5
  seed: 1
  tags: [social_jira4]

environment:
  name: SocialJiraEnvironment
  import_path: experiments.social_jira3.environment:SocialJiraEnvironment
  num_tasks: 2
  scenario_type: conflict
  assignment_filling: false
  n_distractors: 3
  n_signal_threads: 2
  signal_recipient: friend
  secrecy_request: "off"

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: vllm-qwen3.6-35b-a3b
    llm:
      provider: vllm
      vllm:
        auto_start_server: true       # framework spawns + /models health-checks vLLM on this node
        persistent_server: true
        health_check_path: "/models"
        startup_timeout: 3600          # GDN kernels JIT-compile on first run — allow ample time
        connection_timeout: 600
        env:
          HF_HOME: "/fast/jtaraz/hf_cache"   # COMPLETE snapshot (incl. multimodal processor configs)
        params:
          max_tokens: 20000
          temperature: 0.7
        models:
          - checkpoint: "Qwen/Qwen3.6-35B-A3B"
            host: "127.0.0.1"
            port: 8044
            request_timeout: 600       # per-request READ timeout; long CoT >> the 60s default
            tensor_parallel_size: 2    # 35B-A3B MoE bf16 ~70GB -> 2x H100-80GB (== request_gpus)
            gpu_memory_utilization: 0.9
            max_model_len: 128000      # gated-delta-net -> cheap state; verbose posts accumulate
            trust_remote_code: true    # novel gated-delta-net arch
            tool_call_parser: "qwen3_coder"   # Qwen3.6 emits XML <function=..><parameter=..> tool
                                              # calls, NOT hermes-JSON; hermes silently fails -> 0 pairs
            reasoning_parser: "qwen3"
            additional_args:
              - "--enable-auto-tool-choice"
              - "--tool-call-parser"
              - "qwen3_coder"
              - "--reasoning-parser"
              - "qwen3"

experiment:
  tag: social_jira4_qwen3_6_35b_vllm_r4
  planning_rounds: 4
  min_planning_rounds: 2
  early_stop: true
  max_conversation_steps: 5
  log_prompts: true
  robust_assignment: false
