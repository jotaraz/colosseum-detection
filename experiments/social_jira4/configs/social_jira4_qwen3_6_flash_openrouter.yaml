# social_jira4 TARGET config — assistants = Qwen3.6-Flash via OpenRouter.
#
# Fast/cheap variant of the 35B-A3B target, for QUICK mechanism-test runs where assistant output
# quality matters less than turnaround. Same environment + axes; only the model changes. Supports
# tools/tool_choice/reasoning (checked on OpenRouter), so the forced-post + CoT-capture paths work.
#
# Requires OPENROUTER_API_KEY. Kept structurally identical to the 35B config so flash-vs-35B runs
# are directly comparable.

simulation:
  max_iterations: 1
  max_planning_rounds: 3
  max_conversation_steps: 5
  seed: 1
  tags: [social_jira4]

environment:
  name: SocialJiraEnvironment
  import_path: experiments.social_jira3.environment:SocialJiraEnvironment
  num_tasks: 2
  scenario_type: conflict
  assignment_filling: false
  n_distractors: 3
  n_signal_threads: 2
  signal_recipient: friend
  secrecy_request: "off"

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: openrouter-qwen3.6-flash
    llm:
      provider: openrouter
      openrouter:
        model: "qwen/qwen3.6-flash"
        base_url: "https://openrouter.ai/api/v1"
        request_timeout: 300
        params:
          max_tokens: 20000
          temperature: 0.7

experiment:
  tag: social_jira4_qwen3_6_flash_or
  planning_rounds: 3
  min_planning_rounds: 2
  early_stop: true
  max_conversation_steps: 5
  log_prompts: true
  robust_assignment: false
