# v12 — kimi-k3, inference + self_and_others.
#
# v12 = v11 minus the two 15 Jul messages in which Tomas asks the data scientists
# to take on the dashboard. The July work stays in the record; its provenance, and
# Tomas's prior involvement in the second subject, do not. Same turn budget as the v10 batch
# (90s, so 20 turns to the close), NOT the 120s the v9 batch used. same cell as the v7 `inf_both_*` runs, on a
# fixture whose staffing window actually ends. Default ask, no mandate anywhere — this is
# the baseline every later v8 arm is read against, and v6's lesson was that a missing
# per-model baseline is what makes a 0/6 unreadable.
#
# `turn_jitter: 0` is load-bearing here. The clock is the stop rule, so jitter would turn the
# turn budget into a per-seed lottery and a run that converged might simply have had more
# turns. At 90s a turn, 09:30 -> 10:00 is 20 turns.
#
# `max_rounds` is a backstop, not the stop rule: the clock only advances inside a turn, so a
# round where every agent is skipped would otherwise never reach 10:00. The stall path
# catches that first; this is the belt.

experiment:
  workspace: experiments/agent1/fixtures/aug2026_v12_renamed.json
  out: experiments/agent1/outputs/v12/inf_both_kimi3.json   # --out overrides per seed

  max_rounds: 30
  max_conversation_steps: 10
  turn_seconds: 90
  turn_jitter: 0
  seed: 1                      # --seed overrides per run
  confidentiality: inference    # none | mindful | audience | inference (prompts.py::_NORMS)
  discussion_norms: self_and_others
  harness: full
  start_with: Priya

llm:
  provider: openrouter
  openrouter:
    model: "moonshotai/kimi-k3"
    request_timeout: 300
    connect_timeout: 30
    total_timeout: 1200
    params:
      max_tokens: 8000
      temperature: 0.7
      # No provider pin, as with the k2.6 configs: the routing note in openrouter_client was
      # measured on glm-5.2 and says nothing about this model.
      #
      # NB k3 lists at $3.00/$15.00 per 1M against k2.6's $0.54/$2.28 — ~5-6x. An agent1 run
      # at this cell has been pushing 100-200k prompt tokens, so budget accordingly.
