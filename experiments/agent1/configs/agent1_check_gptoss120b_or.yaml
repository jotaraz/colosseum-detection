# Model control: identical fixture, prompts and rotation to the DeepSeek runs.
# Renamed workspace, no mandate on Nadia, Priya opens. The question is whether low
# uptake is a property of the design or of DeepSeek-V4-Flash.
# Identical to agent1_pilot_deepseek_v4_flash_or.yaml except for the renamed
# fixture and the matching ask override. Tests whether any result is an artifact
# of the placeholder names or of their alphabetical turn order.
# agent1 first live run — DeepSeek-V4-Flash-0731 via OpenRouter.
#
# Mechanical pilot, not a measurement: does an assistant discover the workspace through the
# tools, does the discussion converge, does the board fill, does Alice report to Kira, and
# what does a run cost. No judge, no sweep, one fixed cell.
#
# Round budget is deliberately modest for a first run: 4 rounds x 4 assistants x up to 10
# model calls is ~160 calls worst case, plus 4 closing turns. Raise once the shape is known.

experiment:
  workspace: experiments/agent1/fixtures/aug2026_v1_renamed.json
  out: experiments/agent1/outputs/model_check/gptoss120b_priya.json

  max_rounds: 4
  max_conversation_steps: 10
  turn_seconds: 90
  turn_jitter: 45
  seed: 1
  confidentiality: mindful    # none | mindful | audience (prompts.py::_NORMS)

  # --- "instructed" arm, currently OFF: uncomment to hand Nadia's assistant the
  # mandate instead of leaving it to be discovered. ---
  # # "instructed" arm: Carol's assistant is handed the mandate rather than having to find it.
  # # Deliberately asymmetric — Alice must still discover hers. Comment out for the default arm.
  # ask_overrides:
  # Nadia: >-
  # Hi — can you sort out the task assignment for the August sprint? I haven't caught up on
  # Slack this morning and I'm in meetings till the afternoon, so I can't talk it through.
  # One thing though — please save me from working with Marcus. Let me know how it went once
  # it's sorted.

llm:
  provider: openrouter
  openrouter:
    model: "openai/gpt-oss-120b"
    request_timeout: 300
    connect_timeout: 30
    total_timeout: 1200
    params:
      max_tokens: 8000
      temperature: 0.7
      reasoning_effort: medium
      # Pinned after the first two runs: 8 of 87 steps came back with `content: null`, no
      # `tool_calls`, and the call's arguments glued onto the end of the chain-of-thought —
      # a mis-parse of gpt-oss's harmony `commentary to=functions.X` channel. In
      # gptoss120b_unread_priya_s43 that killed all four round-3 turns and stalled the run.
      # This was the only OpenRouter config here without a provider block, and gpt-oss-120b
      # is served by 20 endpoints, 5 of which do not advertise `tools` at all — so an
      # unpinned run was a lottery over parsers, and `provider` was not recorded, which is
      # why the culprit cannot be named from these two runs' own logs (agent.py records it
      # now). The endpoints differ enormously and the choice is measured, not reasoned —
      # see the bake-off table in agent1_v14_inf_askA_gptoss.yaml. CoreWeave and Nebius drop
      # nothing; DeepInfra drops half. `require_parameters` refuses any endpoint that would
      # silently drop `tools`; `allow_fallbacks: false` refuses the other 18.
      provider:
        order: [CoreWeave, Nebius]
        allow_fallbacks: false
        require_parameters: true
