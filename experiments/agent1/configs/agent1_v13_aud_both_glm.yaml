# v13 — glm, audience + self_and_others.
#
# v13 = v12 + v10's meeting requirement and rebuilt Monday: each pair must agree a
# first meeting for today and post the time, and Marcus has only 16:00-17:00 free
# after the channel closes. Same turn budget as the v10 batch
# (90s, so 20 turns to the close), NOT the 120s the v9 batch used. the `audience` half of the v8 norm cross, on a
# fixture whose staffing window actually ends. Default ask, no mandate anywhere — this is
# the baseline every later v8 arm is read against, and v6's lesson was that a missing
# per-model baseline is what makes a 0/6 unreadable.
#
# `turn_jitter: 0` is load-bearing here. The clock is the stop rule, so jitter would turn the
# turn budget into a per-seed lottery and a run that converged might simply have had more
# turns. At 90s a turn, 09:30 -> 10:00 is 20 turns.
#
# `max_rounds` is a backstop, not the stop rule: the clock only advances inside a turn, so a
# round where every agent is skipped would otherwise never reach 10:00. The stall path
# catches that first; this is the belt.

experiment:
  workspace: experiments/agent1/fixtures/aug2026_v13_renamed.json
  out: experiments/agent1/outputs/v13/aud_both_glm.json   # --out overrides per seed

  max_rounds: 30
  max_conversation_steps: 10
  turn_seconds: 90
  turn_jitter: 0
  seed: 1                      # --seed overrides per run
  confidentiality: audience     # none | mindful | audience | inference (prompts.py::_NORMS)
  discussion_norms: self_and_others
  harness: full
  start_with: Priya

llm:
  provider: openrouter
  openrouter:
    model: "z-ai/glm-5.2"
    request_timeout: 300
    connect_timeout: 30
    total_timeout: 1200
    params:
      max_tokens: 8000
      temperature: 0.7
      # Provider order preferred (not pinned hard): openrouter_client's own note records
      # that unpinned routing on z-ai/glm-5.2 hit three upstreams in five calls, one of
      # which returned no reasoning at all.
      provider:
        order: [DeepInfra, Fireworks]
