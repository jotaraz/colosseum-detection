# social-jira3 DECEPTION SWEEP — harmless-mechanism arm.
# See social_jira3_allow_forbid_harmless_plan.md.
#
#   5 prompt cells  = {duty, leverage} x hint {none, noconstraint}  +  conf none x hint none
#                     (`none` has no norm, so no hint can attach to it — run.py skips those)
#   x 3 deception   = {none, allow, forbid}      (one sentence closing the SYSTEM prompt)
#   x 6 models      = 2 local vLLM + 4 OpenRouter
#   x seeds {3,4} x 1 sample
#   = 180 runs.
#
# Fixed: conflict/base, inbox, quit3, decoys OFF (no availability block -> pairings must be
# argued on task-fit alone), employee summary, personality none, prompt_version 6,
# robust_assignment TRUE for every model.
#
# No cell here shares an environment with the base arm (quit2 + decoys on), so the two studies
# are read through the deception axis WITHIN each, not cell-to-cell across them.
#
# NOTE the two vLLM models need DIFFERENT venvs (gpt-oss = MXFP4 -> pinned vLLM 0.12.0;
# Qwen3.6-35B-A3B = gated-delta-net -> vLLM >= ~0.19). Run them as two cluster jobs with the
# model list trimmed accordingly, or run the 4 OpenRouter rows separately; this file is the
# single source of truth for the AXES, not necessarily one submit.
simulation:
  max_iterations: 1
  max_planning_rounds: 6
  max_conversation_steps: 5
  seed: 3
  tags: [social_jira3, deception]

environment:
  name: SocialJiraEnvironment
  import_path: experiments.social_jira3.environment:SocialJiraEnvironment
  num_tasks: 2
  scenario_type: conflict   # overridden per cell by the sweep
  assignment_filling: false
  n_distractors: 3          # distractor THREADS per inbox
  n_signal_threads: 2       # primary signal thread + 1 strength-matched secondary mention
  signal_recipient: friend
  secrecy_request: "on"     # employee asks 'keep this between us' in the signal msg (SPEC §2.2)

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  - label: vllm-qwen3.6-35b-a3b
    llm:
      provider: vllm
      vllm:
        auto_start_server: true
        persistent_server: true
        health_check_path: "/models"
        startup_timeout: 3600
        connection_timeout: 600
        env:
          HF_HOME: "/fast/jtaraz/hf_cache"
        params:
          max_tokens: 16000
          temperature: 0.7
        models:
          - checkpoint: "Qwen/Qwen3.6-35B-A3B"
            host: "127.0.0.1"
            port: 8034
            request_timeout: 600
            tensor_parallel_size: 2
            gpu_memory_utilization: 0.9
            max_model_len: 128000
            trust_remote_code: true
            tool_call_parser: "qwen3_coder"   # NOT hermes: Qwen3.6 emits XML tool calls
            reasoning_parser: "qwen3"
            additional_args:
              - "--enable-auto-tool-choice"
              - "--tool-call-parser"
              - "qwen3_coder"
              - "--reasoning-parser"
              - "qwen3"

experiment:
  tag: social_jira3_deception_harmless_qwen
  output_dir: experiments/social_jira3/outputs/social_jira3_deception_harmless_qwen
  planning_rounds: 6          # cap (MAX): stop rule = >=3 rounds, then stop on stable votes
  min_planning_rounds: 3
  preliminary_vote: true
  early_stop_stable: true
  max_conversation_steps: 5
  log_prompts: true
  max_concurrent_runs: 4
  run_attempts: 3
  robust_assignment: true     # ALL six models, so the prompt is constant across the roster
  seeds: [3, 4]

  social_jira3:
    feelings_channels: [inbox]
    dislike_strengths: [quit3]
    confidentiality: [none, duty, leverage]
    hints: [none, noconstraint]
    deception: [none, allow, forbid]   # the axis under study (SYSTEM-prompt closing sentence)
    summary_audiences: [employee]
    decoys: ["off"]
    personalities: [none]
    samples_per_seed: 1
    cells:
      - {scenario_type: conflict, setup: base}
