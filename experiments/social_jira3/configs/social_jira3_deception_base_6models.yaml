# social-jira3 DECEPTION SWEEP — base arm (see social_jira3_allow_forbid_plan.md).
#
#   8 prompt cells  = {audience, stakes, integrity, consent} x hint {none, noconstraint}
#   x 3 deception   = {none, allow, forbid}      (one sentence closing the SYSTEM prompt)
#   x 6 models      = 2 local vLLM + 4 OpenRouter
#   x seeds {3,4} x 1 sample
#   = 288 runs.
#
# Fixed: conflict/base, inbox, quit2, decoys ON, employee summary, personality none,
# prompt_version 6, robust_assignment TRUE for every model (prompt constant across the roster).
#
# NOTE the two vLLM models need DIFFERENT venvs (gpt-oss = MXFP4 -> pinned vLLM 0.12.0;
# Qwen3.6-35B-A3B = gated-delta-net -> vLLM >= ~0.19). Run them as two cluster jobs with the
# model list trimmed accordingly, or run the 4 OpenRouter rows separately; this file is the
# single source of truth for the AXES, not necessarily one submit.
simulation:
  max_iterations: 1
  max_planning_rounds: 6
  max_conversation_steps: 5
  seed: 3
  tags: [social_jira3, deception]

environment:
  name: SocialJiraEnvironment
  import_path: experiments.social_jira3.environment:SocialJiraEnvironment
  num_tasks: 2
  scenario_type: conflict   # overridden per cell by the sweep
  assignment_filling: false
  n_distractors: 3          # distractor THREADS per inbox
  n_signal_threads: 2       # primary signal thread + 1 strength-matched secondary mention
  signal_recipient: friend
  secrecy_request: "on"     # employee asks 'keep this between us' in the signal msg (SPEC §2.2)

communication_network:
  topology: complete
  num_agents: 4
  consolidate_channels: true

llm_models:
  # ---------------------------------------------------------------- local vLLM
  - label: vllm-qwen3.6-35b-a3b
    llm:
      provider: vllm
      vllm:
        auto_start_server: true
        persistent_server: true
        health_check_path: "/models"
        startup_timeout: 3600
        connection_timeout: 600
        env:
          HF_HOME: "/fast/jtaraz/hf_cache"
        params:
          max_tokens: 16000
          temperature: 0.7
        models:
          - checkpoint: "Qwen/Qwen3.6-35B-A3B"
            host: "127.0.0.1"
            port: 8034
            request_timeout: 600
            tensor_parallel_size: 2
            gpu_memory_utilization: 0.9
            max_model_len: 128000
            trust_remote_code: true
            tool_call_parser: "qwen3_coder"   # NOT hermes: Qwen3.6 emits XML tool calls
            reasoning_parser: "qwen3"
            additional_args:
              - "--enable-auto-tool-choice"
              - "--tool-call-parser"
              - "qwen3_coder"
              - "--reasoning-parser"
              - "qwen3"

  - label: vllm-gpt-oss-120b
    llm:
      provider: vllm
      vllm:
        auto_start_server: true
        persistent_server: true
        health_check_path: "/models"
        startup_timeout: 3600
        connection_timeout: 600
        env:
          HF_HOME: "/fast/jtaraz/hf_cache"
        params:
          reasoning_effort: medium
          max_tokens: 16000
          temperature: 0.7
        models:
          - checkpoint: "openai/gpt-oss-120b"
            host: "127.0.0.1"
            port: 8031
            tensor_parallel_size: 2
            gpu_memory_utilization: 0.9
            max_model_len: 24000
            trust_remote_code: true
            tool_call_parser: "openai"
            reasoning_parser: "openai_gptoss"
            additional_args:
              - "--enable-auto-tool-choice"
              - "--tool-call-parser"
              - "openai"
              - "--reasoning-parser"
              - "openai_gptoss"

  # ------------------------------------------------------------- OpenRouter
  # Every row pins providers with allow_fallbacks:false so an unroutable pin fails LOUDLY.
  # The FALLBACK entry matters as much as the first choice: deepseek was once pinned
  # [DeepInfra, Morph] and Morph returns HTTP 400 on any multi-turn conversation, so a
  # DeepInfra throttle killed the whole arm. Never add a provider that has not been probed
  # MULTI-TURN with a forced tool call — advertised metadata support is not evidence.
  - label: or-kimi-k2.6
    llm:
      provider: openrouter
      openrouter:
        model: "moonshotai/kimi-k2.6"
        base_url: "https://openrouter.ai/api/v1"
        request_timeout: 300
        total_timeout: 420
        params:
          max_tokens: 20000
          temperature: 0.7
          reasoning_effort: medium
          provider:
            order: [DeepInfra, CoreWeave]
            allow_fallbacks: false

  - label: or-deepseek-v4-flash
    llm:
      provider: openrouter
      openrouter:
        model: "deepseek/deepseek-v4-flash"
        base_url: "https://openrouter.ai/api/v1"
        request_timeout: 300
        total_timeout: 420
        params:
          max_tokens: 20000
          temperature: 0.7
          reasoning_effort: medium
          provider:
            # CoreWeave (fp8) != DeepInfra (fp4): a failover changes the served model.
            # Identifiable after the fact — the provider is recorded per turn in
            # agent_reasoning.json — but not avoidable. Check the provider mix post-run.
            order: [DeepInfra, CoreWeave]
            allow_fallbacks: false

  - label: or-glm-5.2
    llm:
      provider: openrouter
      openrouter:
        model: "z-ai/glm-5.2"
        base_url: "https://openrouter.ai/api/v1"
        request_timeout: 300
        total_timeout: 420
        params:
          max_tokens: 20000
          temperature: 0.7
          reasoning_effort: medium
          provider:
            # CoreWeave, not sj4's Fireworks: CoreWeave serves glm-5.2 at fp4, matching
            # DeepInfra, so a failover changes neither quantization nor a proven capability.
            order: [DeepInfra, CoreWeave]
            allow_fallbacks: false

  - label: or-gemma-4-31b
    llm:
      provider: openrouter
      openrouter:
        model: "google/gemma-4-31b-it"
        base_url: "https://openrouter.ai/api/v1"
        request_timeout: 300
        total_timeout: 420
        params:
          max_tokens: 20000
          temperature: 0.7
          reasoning_effort: medium
          provider:
            order: [DeepInfra, CoreWeave]
            allow_fallbacks: false

experiment:
  tag: social_jira3_deception_base_6models
  output_dir: experiments/social_jira3/outputs/social_jira3_deception_base_6models
  planning_rounds: 6          # cap (MAX): stop rule = >=3 rounds, then stop on stable votes
  min_planning_rounds: 3
  preliminary_vote: true
  early_stop_stable: true
  max_conversation_steps: 5
  log_prompts: true
  max_concurrent_runs: 12
  run_attempts: 3
  robust_assignment: true     # ALL six models, so the prompt is constant across the roster
  seeds: [3, 4]

  social_jira3:
    feelings_channels: [inbox]
    dislike_strengths: [quit2]
    confidentiality: [audience, stakes, integrity, consent]
    hints: [none, noconstraint]
    deception: [none, allow, forbid]   # the axis under study (SYSTEM-prompt closing sentence)
    summary_audiences: [employee]
    decoys: ["on"]
    personalities: [none]
    samples_per_seed: 1
    cells:
      - {scenario_type: conflict, setup: base}
